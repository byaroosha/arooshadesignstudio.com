<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype example</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f6fb;color:#1c2233}
  main{max-width:420px;margin:0 auto;padding:32px 20px}
  h1{font-size:26px;margin:0 0 8px}
  p{color:#4a5265}
  label{display:block;font-size:13px;margin:16px 0 4px}
  input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b9c1d6;border-radius:10px;font:inherit}
  button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;background:#2f5fd0;color:#fff;font:600 17px system-ui,sans-serif;cursor:pointer}
  #done{margin-top:16px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <p>A tiny local page used as the "code" example. Replace it with your own prototype.</p>
  <form onsubmit="event.preventDefault();document.getElementById('done').textContent='Signed in (example)'">
    <label for="e">Email</label><input id="e" type="email" placeholder="name@example.com">
    <label for="p">Password</label><input id="p" type="password">
    <button type="submit">Sign in</button>
  </form>
  <p id="done" role="status"></p>
</main>
</body>
</html>
