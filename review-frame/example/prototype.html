<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placeholder coded prototype</title>
<style>
  /* A stand-in for a coded prototype, used by the "code" example in review.config.json. Replace it with your own page. */
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#111827;background:#fff}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:#f3f4f6}
  .logo{width:96px;height:28px;border-radius:6px;background:#9ca3af}
  main{max-width:720px;margin:0 auto;padding:48px 24px}
  h1{margin:0 0 12px;font-size:36px}
  p{margin:0 0 24px;color:#4b5563;line-height:1.5}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 24px;background:#374151;color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:#374151;border:2px solid #6b7280}
  .step[hidden]{display:none}
  .row{display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="logo"></div><span>Placeholder coded prototype</span></header>
<main>
  <section class="step" id="step-1">
    <h1>Welcome</h1>
    <p>This page stands in for a coded prototype. It runs inside the review frame untouched.</p>
    <button type="button" data-go="step-2">Get started</button>
  </section>
  <section class="step" id="step-2" hidden>
    <h1>Step two</h1>
    <p>The prototype keeps its own state and navigation. The review layer only sits around it.</p>
    <div class="row">
      <button type="button" class="secondary" data-go="step-1">Back</button>
      <button type="button" data-go="step-3">Continue</button>
    </div>
  </section>
  <section class="step" id="step-3" hidden>
    <h1>Done</h1>
    <p>End of the placeholder flow.</p>
    <button type="button" class="secondary" data-go="step-1">Start over</button>
  </section>
</main>
<script>
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) return;
    document.querySelectorAll('.step').forEach(function (s) { s.hidden = s.id !== b.dataset.go; });
  });
</script>
</body>
</html>
