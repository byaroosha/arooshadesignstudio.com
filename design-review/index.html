<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Monitoring Program Renewal Review</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed review bar; a scrolling stage that lists the Figma screens of one flow in order; a side panel that takes width from the stage. */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#f7f8fa; --fg:#17181c; --muted:#646873; --border:#d9dce3; --border-strong:#b9bec9;
  --accent:#e8590c; --accent-soft:rgba(232,89,12,.14); --accent-fg:#ffffff;
  --ux:#0f766e; --ux-soft:rgba(15,118,110,.12); --stake:#7e22ce; --stake-soft:rgba(126,34,206,.12);
  --ok:#15803d; --ok-soft:rgba(21,128,61,.12); --warn:#a16207; --warn-soft:rgba(161,98,7,.14); --bad:#c2302b;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 8px 24px rgba(16,18,24,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121317; --surface:#1b1d23; --surface-2:#22252d; --fg:#e9e9ee; --muted:#9a9eab; --border:#2d313b; --border-strong:#444a57;
  --accent:#ff8a4c; --accent-soft:rgba(255,138,76,.18); --accent-fg:#1a0d05;
  --ux:#5ed3c7; --ux-soft:rgba(94,211,199,.16); --stake:#c89bf5; --stake-soft:rgba(200,155,245,.16);
  --ok:#5fcf7c; --ok-soft:rgba(95,207,124,.16); --warn:#e3c04a; --warn-soft:rgba(227,192,74,.16); --bad:#f26b63;
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1b1d23; --surface-2:#22252d; --fg:#e9e9ee; --muted:#9a9eab; --border:#2d313b; --border-strong:#444a57;
  --accent:#ff8a4c; --accent-soft:rgba(255,138,76,.18); --accent-fg:#1a0d05;
  --ux:#5ed3c7; --ux-soft:rgba(94,211,199,.16); --stake:#c89bf5; --stake-soft:rgba(200,155,245,.16);
  --ok:#5fcf7c; --ok-soft:rgba(95,207,124,.16); --warn:#e3c04a; --warn-soft:rgba(227,192,74,.16); --bad:#f26b63;
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*,*::before,*::after{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column}

#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-group{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.bar-spacer{flex:1}
.brand{font-weight:600;white-space:nowrap}
.brand small{color:var(--muted);font-weight:400;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:6px 10px;color:var(--muted);font-weight:500;line-height:1}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button + button{border-left:1px solid var(--border)}
.ctl{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px;line-height:1.2;min-height:32px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
select.ctl{padding-right:28px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:260px}
.ctl:hover{border-color:var(--border-strong)}
.ctl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.icon-btn{position:relative;width:36px;height:32px;padding:0;justify-content:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:300px;max-width:min(420px,90vw);padding:8px}
.menu h4{margin:6px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.changes{list-style:none;margin:0;padding:0}
.changes li{padding:8px 6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px;cursor:pointer;border-radius:6px}
.changes li:hover{background:var(--surface-2)}
.changes li:first-child{border-top:0}
.changes .where{font-size:12px;color:var(--muted)}
.changes .empty{color:var(--muted);padding:8px 6px}

#main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;overflow:auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage-inner{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.flow-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.flow-head h1{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
.flow-head .status{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:999px}
.flow-head .meta{color:var(--muted);font-size:12px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--bg);padding-block:6px;margin-block:-6px}
.subnav a{font-size:12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;text-decoration:none;color:var(--muted)}
.subnav a:hover{color:var(--fg);border-color:var(--border-strong)}
.subnav a[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.group{display:flex;flex-direction:column;gap:14px;scroll-margin-top:60px}
.group-head{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--border)}
.group-head .flow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.group-head h2{margin:0;font-size:16px;font-weight:600}
.screen{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;scroll-margin-top:70px;position:relative}
.screen-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.screen-head .step{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.screen-head .name{font-weight:500;flex:1;min-width:0}
.screen-head a{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.screen-head a:hover{color:var(--fg);text-decoration:underline}
.shot{position:relative;background:var(--surface-2)}
.shot img{display:block;width:100%;height:auto;max-width:100%}
.shot .ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.screen.hl{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 6px var(--accent-soft)}
.screen.picking .shot{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);z-index:3;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-fg);border:2px solid var(--surface);font:600 11px/18px var(--font-ui);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;font-variant-numeric:tabular-nums}
.pin.stake{background:var(--stake);color:#fff}
.pin.on{transform:translate(-50%,-50%) scale(1.25);outline:3px solid var(--accent-soft)}
.pin.draft{background:var(--fg);color:var(--bg)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

#panel{width:400px;flex:0 0 400px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#panel[hidden]{display:none}
.panel-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.panel-head h2{margin:0;font-size:15px;font-weight:600}
.panel-head .sub{color:var(--muted);font-size:12px;margin-top:2px}
.panel-head .grow{flex:1;min-width:0}
.x{border:1px solid transparent;background:transparent;border-radius:6px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.x:hover{background:var(--surface-2);color:var(--fg)}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px}
.tabs button{border:0;background:transparent;padding:10px 8px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.count{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.chip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel-body{flex:1;overflow:auto;min-height:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px;padding:18px 6px;text-align:center;border:1px dashed var(--border);border-radius:8px}
.comment{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;grid-template-columns:auto 1fr;gap:6px 10px}
.comment.linked{cursor:pointer}
.comment.linked:hover{border-color:var(--border-strong)}
.comment.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.comment.dim{opacity:.6}
.comment.new{border-left:3px solid var(--accent)}
.num{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;grid-row:1 / span 3}
.num.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.num.general{background:transparent;border-style:dashed;color:var(--muted)}
.c-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.c-meta b{color:var(--fg);font-weight:600}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;line-height:16px;white-space:nowrap}
.pill.ux{background:var(--ux-soft);color:var(--ux)} .pill.stake{background:var(--stake-soft);color:var(--stake)}
.pill.open{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)} .pill.progress{background:var(--warn-soft);color:var(--warn)} .pill.resolved{background:var(--ok-soft);color:var(--ok)}
.pill.newpill{background:var(--accent-soft);color:var(--accent)}
.c-text{font-size:13.5px;line-height:1.45;grid-column:2;white-space:pre-line}
.c-tags{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.area{color:var(--fg);border-color:var(--border-strong)}
.c-actions{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.c-actions select{font-size:12px;padding:3px 24px 3px 8px;min-height:26px;border-radius:6px}
.link-btn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:3px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--fg);background:var(--surface-2)}
details.dismissed{border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
details.dismissed summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:4px 0}
details.dismissed .list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cform{border-top:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.cform h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cform input,.cform textarea,.cform select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 10px}
.cform textarea{min-height:64px;resize:vertical}
.cform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cform .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 8px;font-size:12px}
.area-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.area-pick .tag.area{padding:4px 8px;font-size:12px}
.toast{color:var(--ok);font-size:12px}
.panel-foot{border-top:1px solid var(--border);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
/* Prototype view */
.proto{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.rail{position:sticky;top:0;max-height:calc(100vh - 120px);overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:2px}
.rail .rg{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 8px 4px}
.rail button{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.3;color:var(--fg)}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="step"]{background:var(--accent-soft);font-weight:500}
.rail button .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:none;padding-top:1px;font-variant-numeric:tabular-nums}
.rail button .cnt{margin-left:auto;flex:none;font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0 5px;line-height:15px}
.proto-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:500}
.crumb .sep{opacity:.5}
.proto-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proto-nav .spacer{flex:1}
.hot{position:absolute;border-radius:6px;cursor:pointer;background:transparent;border:2px solid transparent;z-index:2;padding:0}
.hot:hover,.hot:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.screen.show-hot .hot,.screen.flash .hot{border-color:var(--accent);background:var(--accent-soft)}
.hot .lbl{position:absolute;left:0;bottom:calc(100% + 4px);background:var(--fg);color:var(--bg);font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.hot:hover .lbl,.hot:focus-visible .lbl{opacity:1}
.screen.flash{animation:none}
@media (prefers-reduced-motion:no-preference){ .screen.flash .hot{animation:hotflash .9s ease} @keyframes hotflash{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}40%{box-shadow:0 0 0 8px var(--accent-soft)}} }
.end-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);border-radius:8px;padding:10px 12px}

body.present #bar,body.present #panel{display:none}
#exit-present{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--shadow)}
@media (max-width:760px){ #panel{position:absolute;inset:0;width:100%;flex-basis:100%;border-left:0;z-index:8} .brand small{display:none} select.ctl{max-width:200px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

<div id="app">
  <header id="bar">
    <div class="bar-group">
      <span class="brand">Review<small>interactive</small></span>
    </div>
    <div class="bar-group">
      <label class="sr-only" for="flow-select">Flow</label>
      <select id="flow-select" class="ctl"></select>
      <label class="sr-only" for="update-select">Design update</label>
      <select id="update-select" class="ctl"></select>
      <div class="menu-wrap">
        <button type="button" class="ctl" id="changes-btn" aria-expanded="false">What changed</button>
        <div class="menu" id="changes-menu" hidden></div>
      </div>
    </div>
    <div class="bar-spacer"></div>
    <div class="bar-group">
      <div class="seg" role="group" aria-label="Viewing as">
        <button type="button" data-role="designer" aria-pressed="true">Designer</button>
        <button type="button" data-role="stakeholder" aria-pressed="false">Stakeholder</button>
      </div>
      <button type="button" class="ctl icon-btn" id="comments-btn" aria-pressed="false" aria-label="Comments" title="Comments">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.2-4.5A8 8 0 1 1 21 12z"/></svg>
        <span class="badge" id="comments-badge">0</span>
      </button>
    </div>
  </header>
  <div id="main">
    <div id="stage"><div class="stage-inner" id="stage-inner"></div></div>
    <aside id="panel" hidden aria-label="Review panel"></aside>
    <div class="hint" id="hint" hidden></div>
  </div>
</div>

<script>
const DATA = {"fileKey": "zdCMfKcZRcBF0gvQ8ff811", "updates": [{"id": "u20261102", "date": "2026-11-02"}, {"id": "u20261026", "date": "2026-10-26"}], "sections": [{"id": "1:7490", "name": "Schedule and Renew", "status": "design complete", "ticket": "Jira Ticket (DQP-#####)", "groups": [{"flow": "Schedule Last Draw", "flowStatus": "DONE", "label": "Schedule Last Draw and Renew Program", "screens": [{"id": "1:8084", "name": "Schedule and Renew - Click Overflow Option", "w": 1440, "h": 1132, "step": 1, "img": "img/1-8084.webp"}, {"id": "1:14140", "name": "Schedule and Renew Sidesheet - Step 1", "w": 1440, "h": 1024, "step": 2, "img": "img/1-14140.webp"}, {"id": "1:14621", "name": "Schedule and Renew Sidesheet - Step 2 | Prompt Renewal", "w": 1440, "h": 1024, "step": 3, "img": "img/1-14621.webp"}, {"id": "1:15075", "name": "Schedule and Renew Sidesheet - Step 2 | Show Renewal Fields", "w": 1440, "h": 1024, "step": 4, "img": "img/1-15075.webp"}, {"id": "1:17272", "name": "Schedule and Renew Sidesheet - Step 2 | Select Diagnosis", "w": 826, "h": 1882, "step": 5, "img": "img/1-17272.webp"}, {"id": "1:16168", "name": "Schedule and Renew Sidesheet - Step 2 | Click E-Sign", "w": 1440, "h": 2038, "step": 6, "img": "img/1-16168.webp"}, {"id": "1:15616", "name": "Schedule and Renew Sidesheet - Step 2 | Click Submit", "w": 1440, "h": 2038, "step": 7, "img": "img/1-15616.webp"}, {"id": "1:13749", "name": "Schedule and Renew Modal - Confirmation Toast", "w": 1440, "h": 1132, "step": 8, "img": "img/1-13749.webp"}]}, {"flow": "Schedule Last Draw", "flowStatus": "DONE", "label": "Schedule Last Draw Only, No Renewal", "screens": [{"id": "1:8486", "name": "Schedule, No Renew - Step 2", "w": 1440, "h": 1024, "step": 9, "img": "img/1-8486.webp"}, {"id": "1:13295", "name": "Schedule, No Renew - Click Submit", "w": 1440, "h": 1024, "step": 10, "img": "img/1-13295.webp"}, {"id": "1:17440", "name": "Schedule, No Renew - Confirmation Toast", "w": 1440, "h": 1132, "step": 11, "img": "img/1-17440.webp"}]}, {"flow": "Cancel Last Draw", "flowStatus": "DONE", "label": "Cancel Last Draw and Renew Program", "screens": [{"id": "1:8939", "name": "Cancel and Renew - Select Cancel Draw", "w": 1440, "h": 1024, "step": 12, "img": "img/1-8939.webp"}, {"id": "1:11412", "name": "Cancel and Renew - Click Select Reason for Cancellation Dropdown", "w": 1440, "h": 1024, "step": 13, "img": "img/1-11412.webp"}, {"id": "1:11887", "name": "Cancel and Renew - Select Cancellation Reason", "w": 1440, "h": 1024, "step": 14, "img": "img/1-11887.webp"}, {"id": "1:12367", "name": "Cancel and Renew - Click Continue", "w": 1440, "h": 1024, "step": 15, "img": "img/1-12367.webp"}, {"id": "1:12842", "name": "Cancel and Renew - Step 2 Renewal", "w": 1440, "h": 1024, "step": 16, "img": "img/1-12842.webp"}, {"id": "1:16720", "name": "Cancel and Renew - Click Submit", "w": 1440, "h": 1024, "step": 17, "img": "img/1-16720.webp"}, {"id": "1:17851", "name": "Cancel and Renew - Confirmation Toast", "w": 1440, "h": 1132, "step": 18, "img": "img/1-17851.webp"}]}, {"flow": "Cancel Last Draw", "flowStatus": "DONE", "label": "Cancel Last Draw Only, No Renewal", "screens": [{"id": "1:9420", "name": "Cancel, No Renew - Step 2", "w": 1440, "h": 1024, "step": 19, "img": "img/1-9420.webp"}, {"id": "1:10958", "name": "Cancel, No Renew - Click Submit", "w": 1440, "h": 1024, "step": 20, "img": "img/1-10958.webp"}, {"id": "1:18242", "name": "Cancel, No Renew - Confirmation Toast", "w": 1440, "h": 1132, "step": 21, "img": "img/1-18242.webp"}]}, {"flow": "Modify Information", "flowStatus": "DONE", "label": "Modify - Schedule Last Draw", "screens": [{"id": "1:9874", "name": "Modify (Schedule Last Draw) - Click Button", "w": 1440, "h": 1024, "step": 22, "img": "img/1-9874.webp"}, {"id": "1:18633", "name": "Modify (Schedule Last Draw) - Renewal Ordering Page", "w": 1440, "h": 3070, "step": 23, "img": "img/1-18633.webp"}, {"id": "1:19276", "name": "Modify (Schedule Last Draw) - Success Page", "w": 1440, "h": 1008, "step": 24, "img": "img/1-19276.webp"}]}, {"flow": "Modify Information", "flowStatus": "DONE", "label": "Modify - Cancel Last Draw", "screens": [{"id": "1:10416", "name": "Modify (Cancel Last Draw) - Click Button", "w": 1440, "h": 1024, "step": 25, "img": "img/1-10416.webp"}, {"id": "1:18950", "name": "Modify (Cancel Last Draw) - Renewal Ordering Page", "w": 1440, "h": 3092, "step": 26, "img": "img/1-18950.webp"}, {"id": "1:19376", "name": "Modify (Cancel Last Draw) - Success Page", "w": 1440, "h": 1008, "step": 27, "img": "img/1-19376.webp"}]}, {"flow": "Other Formatting", "flowStatus": "DONE", "label": "Limit to Diagnosis Search Results", "screens": [{"id": "1:7502", "name": "Limit Diagnosis Search Results", "w": 1440, "h": 1024, "step": 28, "img": "img/1-7502.webp"}]}], "notes": [{"id": "1:13748", "kind": "Design Insight", "date": null, "text": "“Mark Scheduled and Renew” should only be available for the “Schedule and Renew” badge.", "screen": "1:8084", "fx": 0.06, "fy": 0.06}, {"id": "1:17427", "kind": "Design Insight", "date": null, "text": "Once the user clicks “Submit” and the side sheet closes, the following will occur:\nConfirmation toast message will be displayed.\nBadge updates to “Draw Scheduled” with the corresponding overflow menu of actions.\nIf the “Date of Collection” was updated, this change needs to be reflected in the table and other tabs (if applicable).\nNew program orders should now appear on the Orders tab and the patient’s profile.", "screen": "1:13749", "fx": 0.783, "fy": 0.06}, {"id": "1:17428", "kind": "Design Insight", "date": null, "text": "Once the user clicks “Submit” and the side sheet closes, the following will occur:\nConfirmation toast message will be displayed.\nRow for the patient will be removed from the table since the draw was canceled. The canceled draw should also be removed in other tabs (if applicable) and patient’s profile.\nTab count and table pagination should update.\nNew program orders for the renewal should now appear on the Orders tab, Monitoring To-Do’s (if within the next 30 days) and the patient’s profile.", "screen": "1:17851", "fx": 0.783, "fy": 0.06}, {"id": "1:17429", "kind": "Design Insight", "date": null, "text": "Once the user clicks “Submit” and the side sheet closes, the following will occur:\nConfirmation toast message will be displayed.\nRow for the patient will be removed from the table since the draw was canceled. The canceled draw should also be removed in other tabs (if applicable) and patient’s profile.\nTab count and table pagination should update.\nSince the program has completed without renewal, the patient will be listed under the “Show Completed Programs Ready for Renewal” checkbox.", "screen": "1:18242", "fx": 0.783, "fy": 0.06}, {"id": "1:17430", "kind": "Design Insight", "date": null, "text": "On the full ordering page, searching for a diagnosis displays 30 results, which would take up a lot of space and require more scrolling in the sidesheet, due to the smaller size. Because of this, we should limit the search results to 10 in this quickview, so the whole card can fit without scrolling and to minimize the height.\nThe Business mentioned the diagnosis should most likely stay the same, so generally they wouldn’t have to look for something else, but good to build out for those users who happen to update it.", "screen": "1:7502", "fx": 0.783, "fy": 0.06}, {"id": "1:17431", "kind": "Design Insight", "date": null, "text": "The Draw Preference field by default will be pre-selected with the “Mark the last draw as scheduled” option. When this is selected, there will be a nested field of “Date of Collection” which is pre-populated with the current scheduled date, which is found under the “Upcoming Draw” column in the table.\nBecause this schedules the last draw in the program, the date can be changed as long as it’s within one year from the program’s start date. Any days after should be disabled in the datepipcker.", "screen": "1:14140", "fx": 0.783, "fy": 0.06}, {"id": "1:17432", "kind": "Design Insight", "date": null, "text": "When the user clicks “Continue”, the stepper will advance to Step 2, which is Renew Program. The first step will now have a checkmark in place of a number and since they selected to mark the last draw as scheduled, the date of collection (MM/DD/YYYY) should appear below the “Schedule Last Draw” title.\nA back arrow will be added to the header, so the user can go back to the first step if needed.", "screen": "1:14621", "fx": 0.783, "fy": 0.06}, {"id": "1:17433", "kind": "Design Insight", "date": null, "text": "When the user clicks “Continue”, the stepper will advance to Step 2, which is Renew Program. The first step will now have a checkmark in place of a number and since they selected to cancel the last draw, we will say “Cancel” below the “Schedule Last Draw” title.\nA back arrow will be added to the header, so the user can go back to the first step if needed.", "screen": "1:12842", "fx": 0.283, "fy": 0.06}, {"id": "1:17434", "kind": "Design Insight", "date": null, "text": "Once on the renewal step, the same flow will take place as defined previously under Schedule Last Draw and Renew Program.\nThe only change is the verbiage in the yellow alert message is updated to reflect the cancel action.", "screen": "1:12842", "fx": 0.783, "fy": 0.06}, {"id": "1:17435", "kind": "Design Insight", "date": null, "text": "Any changes the user makes to the renew program section should be retained if they happen to toggle between the Yes/No options for the “Do you want to renew the MRD program for this patient?” field.", "screen": "1:15075", "fx": 0.783, "fy": 0.06}, {"id": "1:17436", "kind": "Design Insight", "date": null, "text": "If the user selects to renew the program for the patient, then all the renewal fields will appear in card format to help segment the information as well as due to how the current Diagnosis component is built. The order of the fields should follow the hierarchy on the order page.\nThe buttons at the bottom will update, adding an additional button of “Modify Information” since it’s needed as part of the renewal flow.", "screen": "1:15075", "fx": 0.283, "fy": 0.06}, {"id": "1:17437", "kind": "Design Insight", "date": null, "text": "The user needs to make 2 selections in order to activate the “Submit” button: Diagnosis and Statement of Medical Necessity e-signature. They can adjust the pre-populated information (frequency, draw schedule or where the draw will be performed by) if needed, but these would be optional actions.", "screen": "1:15616", "fx": 0.783, "fy": 0.06}, {"id": "1:17438", "kind": "Design Insight", "date": null, "text": "When the user clicks “Mark Scheduled and Renew”, a side sheet will appear with the same fields from the Mark Scheduled and Renew flows as we need the user to indicate the last draw appointment was set up as well as prompt for renewal.\nSince there can be a lot of fields, implemented a guided workflow to segment the information into steps, so they can focus on one action a time. First they will decide if they want to schedule the last draw or cancel, since the date can only be changed within one-year from the program’s start date. Then they move on to the renewal prompt, which is optional.", "screen": "1:14140", "fx": 0.283, "fy": 0.06}, {"id": "1:17439", "kind": "Design Insight", "date": null, "text": "The suggested draw schedule will automatically populate for the user using the last draw in the current series and the selected frequency. The user can any of the individual draws if needed.", "screen": "1:17272", "fx": 0.622, "fy": 0.06}, {"id": "1:17849", "kind": "Design Insight", "date": null, "text": "Once the user clicks “Submit” and the side sheet closes, the following will occur:\nConfirmation toast message will be displayed.\nBadge updates to “Draw Scheduled” with adding “Program renewal available” below it, to give visual indication on the table that renewing is available.\nThe overflow menu should have an option to renew.\nIf the “Date of Collection” was updated, this change needs to be reflected in the table and other tabs (if applicable).", "screen": "1:17440", "fx": 0.783, "fy": 0.06}, {"id": "1:17850", "kind": "Design Insight", "date": null, "text": "If the user selects “No, don’t renew”, the “Submit” button will activate. The yellow alert message will remain on the page in the effort to subtly prompt the user to renew.", "screen": "1:13295", "fx": 0.783, "fy": 0.06}, {"id": "1:19267", "kind": "Design Insight", "date": null, "text": "On the Success page once a user has successfully renewed a patient’s program, clicking the “Close” button should direct them back to the Monitoring To-Do’s tab.\nThe following should occur upon a successful submit:\nBadge updates to “Draw Scheduled” with the corresponding overflow menu of actions.\nIf the “Date of Collection” was updated, this change needs to be reflected in the table and other tabs (if applicable).\nNew program orders should now appear on the Orders tab and the patient’s profile.", "screen": "1:19276", "fx": 0.783, "fy": 0.06}, {"id": "1:19268", "kind": "Design Insight", "date": null, "text": "On the Success page once a user has successfully renewed a patient’s program, clicking the “Close” button should direct them back to the Monitoring To-Do’s tab.\nThe following should occur upon a successful submit:\nRow for the patient will be removed from the table since the draw was canceled. The canceled draw should be reflected in other tabs (if applicable) and patient’s profile.\nNew program orders for the renewal should now appear on the Orders tab, Monitoring To-Do’s (if within the next 30 days) and the patient’s profile.", "screen": "1:19376", "fx": 0.783, "fy": 0.06}, {"id": "1:19269", "kind": "Design Insight", "date": null, "text": "If the user selects “Modify Information” from the sidesheet quickview, they will be directed to the full ordering page with all the information pre-populated from the previous program as well as any additional selections made from the sidesheet.\nThe last monitoring draw will NOT be scheduled until the renewal is submitted on the ordering page.\nThis page will be more concise, focusing on MRD and program level fields. The following changes will display:\nTitle of the page will update to “Monitoring Program Renewal”\nOnly show the MRD test group → Remove all others\nShow Monitoring test/code as read-only text\nRemove the “Single Test” option under Monitoring Frequency\nRemove “Save as Draft” button since we need the user to complete the renewal flow to either schedule or cancel the last program draw.\nRest of the ordering workflow should function as normal.", "screen": "1:18633", "fx": 0.283, "fy": 0.06}, {"id": "1:19270", "kind": "Design Insight", "date": null, "text": "If the user selects “Modify Information” from the sidesheet quickview, they will be directed to the full ordering page with all the information pre-populated from the previous program as well as any additional selections made from the sidesheet.\nThe last monitoring draw will NOT be scheduled until the renewal is submitted on the ordering page.\nThis page will be more concise, focusing on MRD and program level fields. The following changes will display:\nTitle of the page will update to “Monitoring Program Renewal”\nOnly show the MRD test group → Remove all others\nShow Monitoring test/code as read-only text\nRemove the “Single Test” option under Monitoring Frequency\nRemove “Save as Draft” button since we need the user to complete the renewal flow to either schedule or cancel the last program draw.\nRest of the ordering workflow should function as normal.", "screen": "1:18950", "fx": 0.283, "fy": 0.06}, {"id": "1:19271", "kind": "Design Insight", "date": null, "text": "If the user decides to cancel out of the renewal ordering full page instead of submitting, they will be directed back to the Monitoring To-Do’s tab. No change will be made to that particular draw for the patient and the badge will still remain as “Schedule Draw” since the action hadn’t been fully completed.", "screen": "1:18633", "fx": 0.783, "fy": 0.06}, {"id": "1:19272", "kind": "Design Insight", "date": null, "text": "If the user hadn’t entered a start date while on the Mark Scheduled and Renew sidesheet, then the same functionality around making the user select a value for Draw 1 before populating the rest of the draw schedule would apply on this order page.", "screen": "1:18633", "fx": 0.783, "fy": 0.06}, {"id": "1:19273", "kind": "Design Insight", "date": null, "text": "If the user hadn’t entered a start date while on the Mark Scheduled and Renew sidesheet, then the same functionality around making the user select a value for Draw 1 before populating the rest of the draw schedule would apply on this order page.", "screen": "1:18950", "fx": 0.783, "fy": 0.06}, {"id": "1:19274", "kind": "Design Insight", "date": null, "text": "If the user decides to cancel out of the renewal ordering full page instead of submitting, they will be directed back to the Monitoring To-Do’s tab. No change will be made to that particular draw for the patient and the badge will still remain as “Schedule Draw” since the action hadn’t been fully completed.", "screen": "1:18950", "fx": 0.783, "fy": 0.06}, {"id": "1:19275", "kind": "Design Insight", "date": null, "text": "The Business changed their minds and now want an update to the draw schedule. If the user changes the date for Draw 1, it should automatically update the subsequent draws based off the frequency and the new date. This will only apply to the first draw. If they make changes to any other draws, it won’t affect the others.", "screen": "1:17272", "fx": 0.622, "fy": 0.06}, {"id": "1:19476", "kind": "Design Insight", "date": null, "text": "If the user selects “No, don’t renew”, the “Submit” button will activate. The yellow alert message will remain on the page in the effort to subtly prompt the user to renew.", "screen": "1:10958", "fx": 0.783, "fy": 0.06}, {"id": "1:19477", "kind": "Flow Update", "date": "2026-10-26", "text": "Decided w/ team that we will automatically pre-populate the draw schedule for the user so they don’t have to do the math themselves by figuring out a start date.", "screen": "1:8084", "fx": 0.5, "fy": 0.06}, {"id": "1:19478", "kind": "Design Insight", "date": null, "text": "When the user selects to cancel the last draw:\nThe “Date of Collection” field will disappear from the screen, since it’s tied to the “Mark the last draw as scheduled” option.\nThe “Select reason for cancellation” field will now appear under the “Cancel the last draw” option. This is current functionality for canceling an order.\nThe “Continue” button will be disabled until a reason is selected by the user.", "screen": "1:11412", "fx": 0.783, "fy": 0.06}, {"id": "1:19480", "kind": "Note", "date": "2026-11-02", "text": "Due to feedback from Compliance, we can present the most recently used diagnosis, but the user has to make the selection themselves, instead of the system automatically selecting it for them.", "screen": "1:15075", "fx": 0.783, "fy": 0.06}]}, {"id": "1:2906", "name": "Renew Program", "status": "design complete", "ticket": "Jira Ticket (DQP-#####)", "groups": [{"flow": "Clinic Draw - Renew", "flowStatus": "DONE", "label": "Renew Program", "screens": [{"id": "1:2913", "name": "Renew Program - Click Overflow Option", "w": 1440, "h": 1132, "step": 1, "img": "img/1-2913.webp"}, {"id": "1:4256", "name": "Renew Program Sidesheet", "w": 1440, "h": 1024, "step": 2, "img": "img/1-4256.webp"}, {"id": "1:6385", "name": "Renew Program Sidesheet (Full View) - Select Diagnosis", "w": 826, "h": 1676, "step": 3, "img": "img/1-6385.webp"}, {"id": "1:5849", "name": "Renew Program Sidesheet (Full View) - Click E-Sign", "w": 1440, "h": 1832, "step": 4, "img": "img/1-5849.webp"}, {"id": "1:5313", "name": "Renew Program Sidesheet (Full View) - Click Submit", "w": 1440, "h": 1832, "step": 5, "img": "img/1-5313.webp"}, {"id": "1:6667", "name": "Renew Program Sidesheet - Confirmation Toast", "w": 1440, "h": 1132, "step": 6, "img": "img/1-6667.webp"}]}, {"flow": "Clinic Draw - Renew", "flowStatus": "DONE", "label": "Modify Information", "screens": [{"id": "1:3724", "name": "Modify (Renew) - Click Button", "w": 1440, "h": 1024, "step": 7, "img": "img/1-3724.webp"}, {"id": "1:7065", "name": "Modify (Renew) - Renewal Ordering Page", "w": 1440, "h": 3154, "step": 8, "img": "img/1-7065.webp"}, {"id": "1:7386", "name": "Modify (Renew) - Success Page", "w": 1440, "h": 1008, "step": 9, "img": "img/1-7386.webp"}]}, {"flow": "Quest Draw - Renew", "flowStatus": "DONE", "label": "Renew Program for IOP/PSC and Mobile Phleb", "screens": [{"id": "1:3317", "name": "Renew Program (Quest Draw) - Click Overflow Option", "w": 1440, "h": 1132, "step": 10, "img": "img/1-3317.webp"}, {"id": "1:4781", "name": "Renew Program (Quest Draw) Sidesheet", "w": 1440, "h": 1024, "step": 11, "img": "img/1-4781.webp"}, {"id": "1:6521", "name": "Renew Program (Quest Draw) Sidesheet (Full)", "w": 826, "h": 1773, "step": 12, "img": "img/1-6521.webp"}]}], "notes": [{"id": "1:6666", "kind": "Design Insight", "date": null, "text": "“Renew Program” should only be available when the Draw Status badge has the text “Program renewal available” below it.", "screen": "1:2913", "fx": 0.06, "fy": 0.06}, {"id": "1:7058", "kind": "Design Insight", "date": null, "text": "When the user clicks the “Renew Program” overflow action, a side sheet will appear with a quickview of a subset of fields from the initial order page. We will carry over the previous program information to make it easier for the user since most of the details won’t need to be changed.", "screen": "1:4256", "fx": 0.783, "fy": 0.06}, {"id": "1:7059", "kind": "Design Insight", "date": null, "text": "When it’s the last draw in a monitoring program that is being collected by Quest (PSC/IOP or Mobile Phlebotomy), the text “Program renewal available” will appear below the Dr e draw will be performed by) if needed, but these would be optional actions.", "screen": "1:5313", "fx": 0.783, "fy": 0.06}, {"id": "1:7486", "kind": "Design Insight", "date": null, "text": "On the Success page once a user has successfully renewed a patient’s program, clicking the “Close” button should direct them back to the Monitoring To-Do’s tab.\nThe following should occur upon a successful submit:\n“Program Renewal Available” below the Draw Status will be removed since renewal was completed.\nNew program orders should now appear on the Orders tab and the patient’s profile.", "screen": "1:7386", "fx": 0.783, "fy": 0.06}, {"id": "1:7487", "kind": "Design Insight", "date": null, "text": "If the user selects “Modify Information” from the sidesheet quickview, they will be directed to the full ordering page with all the information pre-populated from the previous program as well as any additional selections made from the sidesheet.\nThis page will be more concise, focusing on MRD and program level fields. The following changes will display:\nTitle of the page will update to “Monitoring Program Renewal”\nOnly show the MRD test group → Remove all others\nShow Monitoring test/code as read-only text\nRemove the “Single Test” option under Monitoring Frequency\nRemove “Save as Draft” button\nRest of the ordering workflow should function as normal.", "screen": "1:7065", "fx": 0.283, "fy": 0.06}, {"id": "1:7488", "kind": "Design Insight", "date": null, "text": "If the user decides to cancel out of the renewal ordering full page instead of submitting, they will be directed back to the Monitoring To-Do’s tab. No change will be made to that particular draw for the patient.", "screen": "1:7065", "fx": 0.783, "fy": 0.06}]}], "hotspots": {"1:2913": [[1190, 690, 150, 60, "Renew Program (overflow menu)", "1:4256"]], "1:4256": [[1030, 350, 390, 42, "Search for a diagnosis", "1:6385"], [757, 927, 260, 50, "Modify Information", "1:3724"]], "1:6385": [[416, 390, 390, 300, "Pick a diagno }
function syncPost(){ const b = $('#post-btn'); if(!b) return; const f = state.form; b.disabled = !(f.name.trim() && f.text.trim() && (f.type === 'general' || f.screen)); }
function render(){ renderStage(); renderBar(); renderPanel(); }
function hint(t){ const h = $('#hint'); h.textContent = t || ''; h.hidden = !t; }
function edit(id, patch){ state.edits[id] = Object.assign({}, state.edits[id] || {}, patch); save(); }
function select(id, scroll){ state.selected = state.selected === id ? null : id; render(); applyHighlight(scroll); const el = $(`[data-comment="${CSS.escape(id)}"]`, panel); if(el && state.selected) el.scrollIntoView({ block:'nearest' }); }

/* ---------- events ---------- */
$('#changes-btn').addEventListener('click', () => { const m = $('#changes-menu'); m.hidden = !m.hidden; $('#changes-btn').setAttribute('aria-expanded', String(!m.hidden)); });
document.addEventListener('click', e => { if(!e.target.closest('.menu-wrap')){ $('#changes-menu').hidden = true; $('#changes-btn').setAttribute('aria-expanded','false'); } });
$('#changes-menu').addEventListener('click', e => { const li = e.target.closest('[data-goto-note]'); if(!li) return; state.panel = true; state.tab = 'ux'; state.filter = 'All'; state.selected = null; select(li.dataset.gotoNote, true); });
$('#bar').addEventListener('click', e => {
  const b = e.target.closest('button[data-role]'); if(b){ state.role = b.dataset.role; state.selected = null; state.picking = false; hint(''); save(); render(); return; }
});
$('#flow-select').addEventListener('change', e => { state.sectionId = e.target.value; state.selected = null; state.picking = false; state.form.screen = null; state.current = null; state.history = []; hint(''); render(); $('#stage').scrollTop = 0; });
document.addEventListener('keydown', e => {
  if(state.view !== 'proto' || e.target.matches('input, textarea, select')) return;
  const list = allScreens(); const i = list.findIndex(x => x.id === state.current);
  if(e.key === 'ArrowRight' && i < list.length - 1) goTo(list[i+1].id, true);
  if(e.key === 'ArrowLeft'){ if(state.history.length) goTo(state.history.pop(), false); else if(i > 0) goTo(list[i-1].id, false); }
});
$('#update-select').addEventListener('change', e => { state.updateId = e.target.value; state.selected = null; state.picking = false; state.form.screen = null; hint(''); render(); });
$('#comments-btn').addEventListener('click', () => { state.panel = !state.panel; state.selected = null; state.picking = false; hint(''); render(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && state.picking){ state.picking = false; hint(''); render(); } });
$('#stage').addEventListener('click', e => {
  const pin = e.target.closest('[data-pin]'); if(pin){ if(!state.panel){ state.panel = true; } state.selected = null; select(pin.dataset.pin, false); return; }
  const g = e.target.closest('[data-goto-group]'); if(g){ e.preventDefault(); const t = $('#g'+g.dataset.gotoGroup); if(t) t.scrollIntoView({ block:'start', behavior:'smooth' }); return; }
  const jump = e.target.closest('[data-jump]'); if(jump){ e.preventDefault(); goTo(jump.dataset.jump, true); return; }
  if(e.target.closest('#p-next')){ const list = allScreens(); const i = list.findIndex(x => x.id === state.current); if(i < list.length-1) goTo(list[i+1].id, true); return; }
  if(e.target.closest('#p-back')){ if(state.history.length) goTo(state.history.pop(), false); return; }
  if(e.target.closest('#p-restart')){ state.history = []; goTo(firstScreen(), false); return; }
  if(!state.picking){
    const hot = e.target.closest('.hot'); if(hot){ goTo(hot.dataset.to, true); return; }
    const shot = e.target.closest('.shot'); if(shot && state.view === 'proto'){ const sc = shot.closest('.screen'); sc.classList.remove('flash'); void sc.offsetWidth; sc.classList.add('flash'); setTimeout(() => sc.classList.remove('flash'), 900); }
    return;
  }
  const shot = e.target.closest('.shot'); if(!shot) return;
  const r = shot.getBoundingClientRect(); const f = state.form;
  f.screen = shot.closest('[data-screen]').dataset.screen; f.fx = Math.round(((e.clientX - r.left) / r.width) * 1000) / 1000; f.fy = Math.round(((e.clientY - r.top) / r.height) * 1000) / 1000;
  state.picking = false; hint(''); render();
});
panel.addEventListener('click', e => {
  const t = e.target;
  if(t.closest('#panel-close')){ state.panel = false; state.picking = false; hint(''); render(); return; }
  const tab = t.closest('[data-tab]'); if(tab){ state.tab = tab.dataset.tab; state.selected = null; state.filter = 'All'; state.picking = false; hint(''); render(); return; }
  const chip = t.closest('[data-filter]'); if(chip){ state.filter = chip.dataset.filter; render(); return; }
  const dis = t.closest('[data-dismiss]'); if(dis){ edit(dis.dataset.dismiss, { dismissed:true }); if(state.selected === dis.dataset.dismiss) state.selected = null; render(); return; }
  const res = t.closest('[data-restore]'); if(res){ edit(res.dataset.restore, { dismissed:false }); render(); return; }
  const ft = t.closest('[data-ftype]'); if(ft){ state.form.type = ft.dataset.ftype; if(state.form.type === 'general'){ state.form.screen = null; state.picking = false; hint(''); } render(); return; }
  if(t.closest('#pick-area') || t.closest('#pick-change')){ state.picking = true; hint('Click the spot on a screen this comment is about. Esc to cancel.'); render(); return; }
  if(t.closest('#pick-remove')){ state.form.screen = null; render(); return; }
  if(t.closest('#copy-btn')){ copySummary(t.closest('#copy-btn')); return; }
  if(t.closest('#reset-btn')){ state.posted = {}; state.edits = {}; save(); state.selected = null; render(); return; }
  const cm = t.closest('.comment.linked'); if(cm && !t.closest('select') && !t.closest('button') && !t.closest('a')){ select(cm.dataset.comment, true); }
});
panel.addEventListener('change', e => { const s = e.target.closest('[data-status]'); if(s){ edit(s.dataset.status, { status:s.value, resolvedIn: s.value === 'resolved' ? upd().date : null }); render(); } if(e.target.id === 'f-cat') state.form.category = e.target.value; });
panel.addEventListener('input', e => { if(e.target.id === 'f-name') state.form.name = e.target.value; if(e.target.id === 'f-text') state.form.text = e.target.value; syncPost(); });
panel.addEventListener('submit', e => {
  e.preventDefault(); const f = state.form; if(!(f.name.trim() && f.text.trim() && (f.type === 'general' || f.screen))) return;
  const key = state.sectionId + '|' + state.updateId; const list = state.posted[key] = state.posted[key] || { ux:[], stake:[] };
  const c = { id:'p-'+Date.now(), author:f.name.trim(), role: state.tab === 'ux' ? 'UX' : 'Stakeholder', date: todayIso(), screen: f.type === 'area' ? f.screen : null, fx: f.fx, fy: f.fy, category: f.category, status:'open', text: f.text.trim() };
  list[state.tab].unshift(c); save();
  state.form = { name:f.name, text:'', category:'General', type:'general', screen:null, fx:null, fy:null };
  state.selected = c.screen ? c.id : null; render(); applyHighlight(true); const toast = $('#post-toast'); if(toast) toast.textContent = 'Posted.';
});
function copySummary(btn){
  const lines = [`# ${sec().name} · ${fmtDate(upd().date)}`, ''];
  [['Insight from UX','ux'],['Stakeholder feedback','stake']].forEach(([title, tab]) => { const list = visible(tab); lines.push(`## ${title} (${list.length})`);
    list.forEach(c => { const s = c.screen ? screenOf(c.screen) : null; lines.push(`- [${c.status==='resolved'?'x':' '}] ${s?'**'+s.name+'** · ':''}${c.text.replace(/\n/g,' ')} _(${c.author}, ${c.category})_`); }); lines.push(''); });
  const md = lines.join('\n'); const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); };
  const fb = () => { const ta = document.createElement('textarea'); ta.value = md; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent = 'Copy failed'; } document.body.removeChild(ta); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(md).then(done).catch(fb); else fb();
}
render();
</script>
